model = "gpt-6-sol"
model_context_window = 1000000
model_auto_compact_token_limit = 900000
approval_policy = "never"
sandbox_mode = "danger-full-access"

# Project-level Codex Configuration for ThienAn

[features]
[features.code_mode]
direct_only_tool_namespaces = ["mcp__gortex", "gortex"]

[hooks]
# Hook Gortex (enrich) đăng ký ở ~/.codex/config.toml của từng máy (gortex init); không lặp ở đây để không chạy 2 lần.
[[hooks.PreToolUse]]
matcher = "^(Bash|apply_patch)$"

[[hooks.PreToolUse.hooks]]
command = "node \"$(git rev-parse --show-toplevel)/.agents/hooks/guarded-rtk.mjs\" codex"
statusMessage = "Checking ThienAn guardrails..."
timeout = 10
type = "command"

# Nạp sẵn như Claude Code: các tệp dòng @ của AGENTS.md (resume, fork giữ lịch sử nên không nạp lại).
[[hooks.SessionStart]]
matcher = "startup|clear|compact"

[[hooks.SessionStart.hooks]]
command = "node \"$(git rev-parse --show-toplevel)/.agents/hooks/session-context.mjs\" codex"
statusMessage = "Loading ThienAn rules, indexes and memory..."
timeout = 10
additionalContextLimit = 12000
type = "command"

# >>> .agents/mcp/sync.mjs (sinh từ .agents/mcp_config.json — không sửa tay)

[mcp_servers.gortex]
command = "gortex"
args = ["mcp", "--tools", "facade-v1"]
startup_timeout_sec = 90
default_tools_approval_mode = "approve"

[mcp_servers.gortex.env]
GORTEX_INDEX_WORKERS = "8"

[mcp_servers.gortex.tools.tool_profile]
approval_mode = "approve"

[mcp_servers.mssql_dev]
command = "node"
args = [".agents/mcp/dab.mjs", "dev"]
startup_timeout_sec = 60

[mcp_servers.mssql_test]
command = "node"
args = [".agents/mcp/dab.mjs", "test"]
startup_timeout_sec = 60

[mcp_servers.mssql_staging]
command = "node"
args = [".agents/mcp/dab.mjs", "staging"]
startup_timeout_sec = 60
enabled = false

# <<< .agents/mcp/sync.mjs
