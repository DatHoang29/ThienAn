model = "gpt-6-sol"
model_context_window = 1000000
model_auto_compact_token_limit = 900000
approval_policy = "never"
sandbox_mode = "danger-full-access"

# Project-level Codex Configuration for ThienAn

[features]
[features.code_mode]
direct_only_tool_namespaces = ["mcp__gortex", "gortex"]

[hooks]
[[hooks.PostToolUse]]
matcher = "^(Bash|apply_patch|(mcp__gortex__|gortex__)(explore|search|read|relations|trace|analyze))$"

[[hooks.PostToolUse.hooks]]
command = "gortex hook --agent=codex --mode=enrich"
statusMessage = "Loading Gortex post-tool context..."
timeout = 5
type = "command"

[[hooks.PreToolUse]]
matcher = ".*"

[[hooks.PreToolUse.hooks]]
command = "gortex hook --agent=codex --mode=enrich"
statusMessage = "Loading Gortex tool guidance..."
timeout = 5
type = "command"

[[hooks.PreToolUse]]
matcher = "^(Bash|apply_patch)$"

[[hooks.PreToolUse.hooks]]
command = "node \"$(git rev-parse --show-toplevel)/.agents/hooks/guardrails.mjs\""
statusMessage = "Checking ThienAn guardrails..."
timeout = 10
type = "command"

[[hooks.PreToolUse]]
matcher = "^Bash$"

[[hooks.PreToolUse.hooks]]
command = "node \"$(git rev-parse --show-toplevel)/.agents/hooks/validate-tool-call.mjs\""
statusMessage = "Checking destructive commands..."
timeout = 10
type = "command"

[[hooks.SessionStart]]
matcher = "startup|resume|clear|compact"

[[hooks.SessionStart.hooks]]
command = "gortex hook --agent=codex --mode=enrich"
statusMessage = "Loading Gortex graph orientation..."
timeout = 5
type = "command"

[[hooks.Stop]]
[[hooks.Stop.hooks]]
command = "gortex hook --agent=codex --mode=enrich"
statusMessage = "Checking Gortex evidence authority..."
timeout = 5
type = "command"

[[hooks.UserPromptSubmit]]
[[hooks.UserPromptSubmit.hooks]]
command = "gortex hook --agent=codex --mode=enrich"
statusMessage = "Surfacing Gortex graph context for your prompt..."
timeout = 5
type = "command"

[[hooks.UserPromptSubmit.hooks]]
command = "node \"$(git rev-parse --show-toplevel)/.agents/hooks/prompt-submit.mjs\""
statusMessage = "Loading ThienAn SSOT reminder..."
timeout = 10
type = "command"

# >>> .agents/mcp/sync.mjs (sinh từ .agents/mcp_config.json — không sửa tay)

[mcp_servers.gortex]
command = "gortex"
args = ["mcp", "--tools", "facade-v1"]
startup_timeout_sec = 90
default_tools_approval_mode = "approve"

[mcp_servers.gortex.env]
GORTEX_INDEX_WORKERS = "8"

[mcp_servers.gortex.tools.tool_profile]
approval_mode = "approve"

[mcp_servers.mssql_dev]
command = "node"
args = [".agents/mcp/dab.mjs", "dev"]
startup_timeout_sec = 60

[mcp_servers.mssql_test]
command = "node"
args = [".agents/mcp/dab.mjs", "test"]
startup_timeout_sec = 60

[mcp_servers.mssql_staging]
command = "node"
args = [".agents/mcp/dab.mjs", "staging"]
startup_timeout_sec = 60

# <<< .agents/mcp/sync.mjs
