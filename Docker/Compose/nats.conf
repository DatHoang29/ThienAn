# =============================================================================
# Cấu hình NATS Server cho dự án ThienAn ITS015
# Hỗ trợ đồng thời:
# - Cổng 4222: TCP cho Backend (.NET C#)
# - Cổng 12219: WebSocket (ws://...) cho Frontend Vue (Web Browser)
# - Cổng 8222: HTTP Monitoring Dashboard
# - JetStream: Bật lưu trữ hàng đợi / stream
# =============================================================================

port: 4222
http_port: 8222

jetstream {
  store_dir: "/data/jetstream"
}

websocket {
  port: 12219
  no_tls: true
}
