services:
  tac-sqlserver:
    image: mcr.microsoft.com/azure-sql-edge:1.0.7
    container_name: tac_webapi_sqlserver
    user: root
    restart: always
    ports:
      - "14333:1433"
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Password123!
      - MSSQL_SA_PASSWORD=Password123!
    volumes:
      - tac_webapi_tac_sql_data:/var/opt/mssql/data

  tac-nats:
    image: nats:latest
    container_name: tac_webapi_nats
    restart: always
    ports:
      - "4222:4222"
      - "8222:8222"
    command: "-js"

volumes:
  tac_webapi_tac_sql_data:
