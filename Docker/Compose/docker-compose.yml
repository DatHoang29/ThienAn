# Tên của Docker Compose Project - hiển thị làm tên nhóm trên Docker Desktop
name: its015

services:
  # =========================================================================
  # 1. SQL SERVER DATABASE
  # =========================================================================
  tac-sqlserver:
    # Bản Azure SQL Edge (tương thích SQL Server, nhẹ, chạy mượt trên cả chip ARM/Apple Silicon lẫn x64)
    image: mcr.microsoft.com/azure-sql-edge:latest
    # Cố định tên container để dễ quản lý, không bị sinh hậu tố ngẫu nhiên
    container_name: tac_webapi_sqlserver
    # Quyền root bên trong container để có quyền đọc/ghi vào thư mục volume mount
    user: root
    # Tự động khởi động lại khi container bị lỗi hoặc khi máy tính / Docker khởi động lại
    restart: always
    # Mở port kết nối: [Port máy thật : Port trong container]
    ports:
      - "1433:1433"   # Cổng kết nối SQL Server mặc định
      - "14333:1433"  # Cổng phụ 14333 (dành cho DAP MCP, Unit Test runner, local dev)
    # Biến môi trường cấu hình ban đầu cho SQL Server
    environment:
      - ACCEPT_EULA=Y                # Đồng ý với điều khoản sử dụng của Microsoft
      - SA_PASSWORD=Tac@@1234        # Mật khẩu tài khoản quản trị 'sa'
      - MSSQL_SA_PASSWORD=Tac@@1234  # Biến dự phòng cho một số phiên bản SQL Server
    # Ánh xạ thư mục lưu trữ CSDL ra volume vật lý để dữ liệu không bị mất khi xóa container
    volumes:
      - tac_webapi_tac_sql_data:/var/opt/mssql/data

  # =========================================================================
  # 2. NATS MESSAGE BROKER (Hàng đợi tin nhắn / Pub-Sub)
  # =========================================================================
  tac-nats:
    # Image NATS chính thức bản mới nhất
    image: nats:latest
    container_name: tac_webapi_nats
    restart: always
    ports:
      - "4222:4222"     # Cho Backend C# (.NET) - TCP (Pub/Sub, Request/Reply)
      - "12219:12219"   # Cho Web Frontend (Vue) - WebSocket (ws://...)
      - "8222:8222"     # Cổng Dashboard HTTP Monitoring (xem metrics, trạng thái server)
    # File cấu hình chuẩn hóa NATS (hỗ trợ WebSocket ws://:12219, TCP 4222, HTTP 8222 và JetStream)
    volumes:
      - ./nats.conf:/etc/nats/nats.conf
    command: ["-c", "/etc/nats/nats.conf"]

  # =========================================================================
  # 3. REDIS IN-MEMORY CACHE & DATA STORE
  # =========================================================================
  tac-redis:
    # Bản Redis v7 chạy trên Alpine Linux siêu nhẹ (~30MB)
    image: redis:7-alpine
    container_name: tac_webapi_redis
    restart: always
    ports:
      - "16379:6379" # Cổng phụ mở cho các cấu hình kết nối cổng 16379
      - "6379:6379"  # Cổng chuẩn mặc định của Redis
    # Bật chế độ AOF (Append Only File) để lưu dữ liệu xuống đĩa, tránh mất cache khi restart
    command: "redis-server --appendonly yes"
    # Lưu file dữ liệu của Redis ra volume ngoài container
    volumes:
      - tac_webapi_redis_data:/data

  # =========================================================================
  # 4. KAFKA MESSAGE BROKER (Sự kiện / Dòng dữ liệu phân tán - KRaft 1 node)
  # =========================================================================
  tac-kafka:
    # Image Apache Kafka 3.8.0 chạy KRaft mode không cần ZooKeeper
    image: apache/kafka:3.8.0
    container_name: tac_webapi_kafka
    restart: always
    ports:
      - "19092:19092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:19092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://127.0.0.1:19092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true

  # =========================================================================
  # 5. FTP SERVER (Truyền nhận tệp CSV / JSON)
  # =========================================================================
  tac-ftp:
    # Image FTP server nhẹ trên Alpine Linux
    image: delfer/alpine-ftp-server:latest
    container_name: tac_webapi_ftp
    restart: always
    ports:
      - "2121:21"
      - "21000-21010:21000-21010"
    environment:
      - USERS=tactest|Tac@@1234|/ftp/tactest
      - ADDRESS=127.0.0.1
      - MIN_PORT=21000
      - MAX_PORT=21010
    command: ["/bin/sh", "-c", "mkdir -m 777 -p /ftp/tactest/sharedata-test && rm -rf /sharedata-test && ln -s /ftp/tactest/sharedata-test /sharedata-test && exec /bin/start_vsftpd.sh"]

# ===========================================================================
# CẤU HÌNH VOLUME LƯU TRỮ VĨNH VIỄN (PERSISTENT DATA)
# ===========================================================================
volumes:
  tac_webapi_tac_sql_data:
    # external: true báo cho Compose biết volume này ĐÃ TỒN TẠI trên máy từ trước
    external: true
    # Trỏ đúng tên volume vật lý để giữ nguyên toàn bộ Database SQL Server mà không bị tạo mới rỗng
    name: tac_webapi_tac_sql_data

  tac_webapi_redis_data:
    # Volume lưu trữ dữ liệu cache Redis
    name: tac_webapi_redis_data
